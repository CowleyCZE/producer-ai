name: Android Debug Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build web MVP
        run: npm run build

      - name: Sync Capacitor Android shell
        run: npx cap sync android

      - name: Cache TFLite model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/gemma-it-2b-int4.tflite
          key: ${{ runner.os }}-tflite-model-v1

      - name: Prepare Android Build
        run: |
          chmod +x android/gradlew
          mkdir -p android/app/src/main/assets
          if [ "${{ steps.cache-model.outputs.cache-hit }}" != "true" ]; then
            echo "Downloading TFLite model..."
            curl -L "https://huggingface.co/Kaggle/gemma/resolve/main/tflite/gemma-it-2b-int4/1/gemma-it-2b-int4.tflite" -o android/app/src/main/assets/gemma-it-2b-int4.tflite
          else
            echo "Model found in cache."
          fi

      - name: Build Debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
